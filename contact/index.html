<!DOCTYPE html>
<html lang="en" data-root="../" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact OmniTools</title>
<meta name="description" content="Get in touch with the OmniTools team to report a bug, suggest a tool, or ask a question.">
<link rel="canonical" href="https://jamamjadalone.github.io/omnitools/contact/index.html">
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a0c11">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/home.css">
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>
<header id="site-header" class="site-header"></header>
<main id="main">
  <div class="container" style="padding-top:40px;max-width:600px;">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Contact</span></nav>
    <div class="section-head">
      <span class="eyebrow">Contact</span>
      <h1>Say hello</h1>
      <p>Found a bug, have a tool idea, or just want to say hi? Send a message below. (This form is a UI demo &mdash; connect it to a form service or your email provider to receive submissions.)</p>
    </div>
    <div class="tool-panel">
      <form id="contactForm">
        <div class="field">
          <label for="contactName">Name</label>
          <input type="text" id="contactName" required>
        </div>
        <div class="field">
          <label for="contactEmail">Email</label>
          <input type="email" id="contactEmail" required>
        </div>
        <div class="field">
          <label for="contactMessage">Message</label>
          <textarea id="contactMessage" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send message</button>
      </form>
    </div>
  </div>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/render.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("contactForm");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    window.OmniTools.showToast("Message ready (demo only, no email sent).", "success");
    form.reset();
  });
});
</script>
</body>
</html>
